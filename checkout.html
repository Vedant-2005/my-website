<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Laptop Store</title>
    <link rel="stylesheet" href="./css/style.css">

   </head>

<body>

    <!-- Navigation Bar -->

    <header>

        <div class="logo">
            Laptop Store
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="products.html">Laptops</a>

            <a href="cart.html">Cart</a>

            <a href="checkout.html">Checkout</a>

        </nav>

    </header>


    <!-- Checkout Section -->

    <section class="checkout">

        <h1>Checkout</h1>

        <form id="checkout-form">

            <label>Full Name</label>

            <input type="text"
                   id="name"
                   placeholder="Enter your full name"
                   required>


            <label>Mobile Number</label>

            <input type="tel"
                   id="mobile"
                   placeholder="Enter your mobile number"
                   required>


            <label>Email</label>

            <input type="email"
                   id="email"
                   placeholder="Enter your email"
                   required>


            <label>Address</label>

            <textarea id="address"
                      placeholder="Enter your address"
                      required></textarea>


            <label>City</label>

            <input type="text"
                   id="city"
                   placeholder="Enter your city"
                   required>


            <label>PIN Code</label>

            <input type="text"
                   id="pincode"
                   placeholder="Enter PIN code"
                   required>


            <label>Payment Method</label>

            <select id="payment">

                <option value="Cash on Delivery">
                    Cash on Delivery
                </option>

                <option value="UPI">
                    UPI
                </option>

                <option value="Card">
                    Credit / Debit Card
                </option>

            </select>


           <button type="button" onclick="placeOrder()">
    Place Order
</button>

        </form>

    </section>


    <footer>

        <p>
            © 2026 Laptop Store | TYBSc Computer Science Project
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
